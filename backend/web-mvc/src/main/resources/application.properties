
spring.datasource.url=jdbc:postgresql://localhost:5432/pocketrip_app
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 8081, ca să poată rula în paralel cu web-api (8080)
server.port=8081

# paginile se recitesc la fiecare cerere: o modificare în .html se vede cu un refresh
spring.thymeleaf.cache=false
